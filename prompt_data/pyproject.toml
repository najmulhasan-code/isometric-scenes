[project]
name = "prompt-data"
version = "0.1.0"
description = "Build pipeline for the scene prompt dataset"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "torch>=2.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
