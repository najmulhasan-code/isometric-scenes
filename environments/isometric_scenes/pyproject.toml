[project]
name = "isometric-scenes"
version = "0.1.5"
description = "Animated isometric SVG scenes of places and objects, scored by code checks, sandbox rendering and a vision judge."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.2.0", "prime-sandboxes>=0.5.0,<0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isometric_scenes", "svg_scoring"]
