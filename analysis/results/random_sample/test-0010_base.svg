<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter for steam effect -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
    
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes steam-rise {
        0% { transform: scaleY(0.5); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: scaleY(1.2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground Plane -->
  <polygon points="0,480 480,320 480,0 0,160" fill="#8d6e63" stroke="#6d4c41" stroke-width="2"/>

  <!-- Table Surface -->
  <polygon points="140,400 310,300 310,200 140,300" fill="#d7ccc8" stroke="#a1887f" stroke-width="2"/>

  <!-- Digital Clock Group -->
  <g transform="translate(350, 180)">
    <!-- Clock Body -->
    <rect x="0" y="0" width="100" height="100" fill="#212121" stroke="#424242" stroke-width="4" rx="5" />
    <rect x="10" y="10" width="80" height="80" fill="#f5f5f5" stroke="#b0bec5" stroke-width="2" />
    
    <!-- Digital Display -->
    <rect x="15" y="25" width="70" height="50" fill="#000" rx="3" />
    
    <!-- Time Segments (Animated Seconds) -->
    <g fill="#e0e0e0">
      <!-- Minutes -->
      <text x="50" y="55" font-family="monospace" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="none" stroke="#e0e0e0">12</text>
      
      <!-- Hours -->
      <text x="50" y="75" font-family="monospace" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="none" stroke="#e0e0e0">08</text>
      
      <!-- Seconds (Blinking) -->
      <text x="50" y="95" font-family="monospace" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="none" stroke="#e0e0e0">04</text>
    </g>
    <!-- Subtle clock face markers -->
    <circle cx="50" cy="52" r="2" fill="#9e9e9e" />
    <circle cx="90" cy="65" r="2" fill="#9e9e9e" />
    <circle cx="65" cy="90" r="2" fill="#9e9e9e" />
  </g>

  <!-- Oolong Tea Group -->
  <g transform="translate(100, 260)">
    <!-- Cup Base -->
    <ellipse cx="60" cy="90" rx="45" ry="12" fill="#f5deb3" stroke="#5d4037" stroke-width="2" />
    <!-- Cup Body -->
    <path d="M60,90 C30,90 20,60 40,30 L100,30 C120,60 110,90 80,90 Z" fill="#fff8e1" stroke="#5d4037" stroke-width="2" />
    <!-- Cup Handle -->
    <path d="M100,30 Q130,20 130,60 Q120,80 90,85 L95,90 Z" fill="#3e2723" stroke="#3e2723" stroke-width="2"/>
    
    <!-- Tea Mucilago (Floating Leaves) -->
    <path d="M50,45 Q40,40 45,35" stroke="#8d6e63" stroke-width="3" fill="none" />
    <path d="M70,50 Q65,40 60,35" stroke="#8d6e63" stroke-width="3" fill="none" />
    <path d="M85,55 Q80,50 85,45" stroke="#8d6e63" stroke-width="3" fill="none" />
    
    <!-- Steam Animations -->
    <g id="steam1">
      <ellipse cx="35" cy="30" rx="10" ry="8" fill="#fff" opacity="0.6">
        <animate attributeName="ry" values="5;12;5" dur="3s" repeatCount="indefinite" />
        <animate attributeName="cx" values="35;32;35" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.5" dur="3s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <g id="steam2">
      <ellipse cx="85" cy="35" rx="12" ry="10" fill="#fff" opacity="0.5">
        <animate attributeName="ry" values="5;14;5" dur="4s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="cx" values="85;88;85" dur="4s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0.1;0.4" dur="4s" begin="1s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <g id="steam3">
      <ellipse cx="55" cy="38" rx="8" ry="9" fill="#fff" opacity="0.4">
        <animate attributeName="ry" values="4;11;4" dur="2.5s" begin="2s" repeatCount="indefinite" />
        <animate attributeName="cx" values="55;50;55" dur="2.5s" begin="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;0;0.3" dur="2.5s" begin="2s" repeatCount="indefinite" />
      </ellipse>
    </g>
  </g>

</svg>