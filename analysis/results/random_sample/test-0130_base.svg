<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .moon { fill: #f0f8ff; filter: drop-shadow(15px 15px 10px #b8c4da); animation: floatMoon 6s ease-in-out infinite alternate; }
      .moon-trail { fill: #e3eef5; opacity: 0.6; }
      .lantern { fill: #1a1a1a; stroke: #555; stroke-width: 2; }
      .wicker { fill: #a67c52; }
      .lamp-flicker { fill: #ffebcd; }
      .glass { fill: none; stroke: #aaccff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px #aaccff); }
      .plasma { fill: #89c2ff; opacity: 0.8; }
      .sink { fill: #ffffff; stroke: #ddd; stroke-width: 2; }
      .sink-faucet { fill: #aaaaaa; }
      .teal-towel { fill: #20b2aa; stroke: #168b83; stroke-width: 2; }
    </style>

    <g id="group-1" transform="translate(0, 0)">
      <!-- Background Floor (Reflective) -->
      <rect x="0" y="300" width="512" height="212" fill="#2a3a45" rx="5" />
      <!-- Reflections on floor -->
      <ellipse cx="300" cy="320" rx="20" ry="15" fill="#4a6a7a" opacity="0.4" transform="rotate(-20 300 320)"/>
      <ellipse cx="150" cy="340" rx="15" ry="12" fill="#6a8a9a" opacity="0.5" transform="rotate(10 150 340)"/>

      <!-- Full Moon -->
      <circle class="moon" cx="400" cy="50" r="60" />
      <g class="moon-trail">
        <circle cx="280" cy="20" r="120" transform="rotate(10) translate(0, -40)" />
        <circle cx="420" cy="70" r="110" transform="rotate(-10) translate(0, -40)" />
      </g>

      <!-- Shadow from moon (long) -->
      <path d="M 60 380 L 60 360 L 200 300 L 220 300 L 220 360 C 220 375 240 375 240 380" fill="none" stroke="#000" stroke-width="2" opacity="0.3"/>

      <!-- Hanging Lantern Group -->
      <g class="lantern" transform="translate(120, 100)">
        <!-- Rope -->
        <line x1="60" y1="0" x2="60" y2="140" stroke="#5c4033" stroke-width="3" stroke-linecap="round" />
        
        <!-- Lantern Body (Woven look) -->
        <rect x="18" y="10" width="64" height="70" fill="none" stroke="none" rx="4" />
        <path class="wicker" d="M 10 15 L 48 15 M 50 15 L 66 15 M 32 20 L 64 20 M 32 25 L 50 25 M 32 30 L 50 30 M 32 35 L 50 35 M 32 40 L 50 40 M 32 45 L 50 45 M 32 80 L 48 80 M 36 80 L 56 80 M 36 85 L 48 85 M 40 90 L 52 90 M 40 22 L 56 22 M 40 45 L 62 45 M 44 50 L 62 50" stroke="#8b5a2b" stroke-width="2" />
        <rect class="wicker" x="18" y="10" width="64" height="60" fill="none" stroke="none" rx="2" />
        
        <!-- Glass/Plasma interior -->
        <path class="plasma" d="M 14 20 Q 38 10 62 20 T 62 40 T 62 60 T 62 80 T 38 70 Q 14 80 14 60 T 14 40 T 14 20" fill="#00ffff" opacity="0.3" />
        
        <!-- Light source inside -->
        <path class="lamp-flicker" d="M 38 25 Q 38 15 32 15 T 32 35 T 38 35 T 38 55 T 42 55 T 42 35 T 48 35 T 48 55 T 48 75 T 48 95" fill="#fff8dc" opacity="0.6" />
        
        <!-- Hanging string for wicker -->
        <line x1="32" y1="10" x2="32" y2="20" stroke="#4a3c2a" stroke-width="1" />
      </g>

      <!-- Glass Shelf (mounted on wall) -->
      <g transform="translate(480, 80)">
        <!-- Frame (floating) -->
        <polygon points="-5,0 0,-40 40,0" stroke="#8888ff" stroke-width="3" fill="none" />
        <rect x="-6" y="-38" width="48" height="1" fill="#9999ff" opacity="0.8" transform="rotate(-5)"/>
        <ellipse cx="0" cy="0" rx="28" ry="1" fill="none" stroke="#9999ff" opacity="0.4" transform="rotate(-5)"/>
      </g>

      <!-- On the Shelf -->
      <g transform="translate(350, 20)">
        <!-- Small Bottle/Container -->
        <ellipse cx="0" cy="0" rx="6" ry="12" fill="#333333" stroke="#111111" />
        <!-- Liquid glow -->
        <ellipse cx="0" cy="-2" rx="5" ry="10" fill="#aa00ff" opacity="0.8" />
      </g>

      <!-- Porcelain Sink -->
      <g transform="translate(450, 320)">
        <rect class="sink" x="10" y="10" width="20" height="15" rx="5" transform="rotate(-15)" />
        <circle cx="20" cy="15" r="2" fill="#333" />
        <!-- Drain -->
        <circle cx="15" cy="20" r="3" fill="#111" opacity="0.5" class="plasma" />
        <!-- Faucet -->
        <rect class="sink-faucet" x="5" y="28" width="30" height="10" transform="rotate(-15)" stroke="#aaaaaa" fill="none" stroke-dasharray="4"/>
        <path class="sink-faucet" d="M 10 30 L 5 28" stroke="#ccc" stroke-width="2" />
      </g>

      <!-- Teal Towel -->
      <g transform="translate(440, 380)">
        <rect x="0" y="0" width="40" height="10" fill="#1a9" transform="rotate(-10)" />
        <rect x="10" y="0" width="8" height="10" fill="#1389" opacity="0.9" />
        <rect x="20" y="0" width="8" height="10" fill="#19a2" opacity="0.9" />
        <rect x="30" y="0" width="8" height="10" fill="#169" opacity="0.9" />
      </g>

    </g>
  </defs>

  <g class="lantern" style="animation-swing 4s ease-in-out infinite alternate;">
    <use href="#group-1" transform="translate(120, 100)" />
  </g>

</svg>