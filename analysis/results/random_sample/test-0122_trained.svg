<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @keyframes gentleBake {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }
      @keyframes rollPinning {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(10px) translateY(-2px); }
        75% { transform: translateX(-10px) translateY(-2px); }
      }
      @keyframes trayGlide {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes subtleShine {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      .bakery-floor {
        animation: gentleBake 8s ease-in-out infinite;
      }
      .mixer-base {
        animation: trayGlide 6s ease-in-out infinite;
      }
      .mixer-head {
        animation: rollPinning 4s ease-in-out infinite;
      }
      .croissant-tray {
        animation: trayGlide 7s ease-in-out infinite;
      }
      .croissants {
        animation: gentleBake 10s ease-in-out infinite;
      }
      .rolling-pin {
        animation: rollPinning 5s ease-in-out infinite;
      }
      .stainless-steel {
        animation: subtleShine 4s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Isometric Bakery Floor -->
  <rect class="bakery-floor" x="50" y="100" width="412" height="300" fill="#e8f4e8" stroke="#c8d8c8" stroke-width="4"/>
  <!-- Isometric Grid Lines -->
  <line x1="50" y1="100" x2="50" y2="400" stroke="#d8e8d8" stroke-width="2" opacity="0.5"/>
  <line x1="462" y1="100" x2="462" y2="400" stroke="#d8e8d8" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="100" x2="462" y2="400" stroke="#d8e8d8" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="400" x2="462" y2="100" stroke="#d8e8d8" stroke-width="2" opacity="0.5"/>
  
  <!-- Stainless Steel Mixer Base -->
  <g class="mixer-base">
    <rect x="150" y="180" width="80" height="60" fill="#b0c4de" stroke="#7f9bc9" stroke-width="3"/>
    <rect x="160" y="190" width="60" height="40" fill="#c4d4ec" stroke="#8fa5d9" stroke-width="2"/>
    <circle cx="190" cy="185" r="8" fill="#e8f4f8" stroke="#a0c0e0" stroke-width="2"/>
  </g>
  
  <!-- Mixer Head with Beaters -->
  <g class="mixer-head">
    <rect x="175" y="150" width="30" height="40" fill="#d8e8f8" stroke="#a0b0d0" stroke-width="3"/>
    <rect x="165" y="165" width="15" height="10" fill="#f0f8ff" stroke="#b0c0e8" stroke-width="2"/>
    <rect x="195" y="165" width="15" height="10" fill="#f0f8ff" stroke="#b0c0e8" stroke-width="2"/>
    <!-- Animated beaters -->
    <rect x="170" y="145" width="8" height="15" fill="#ffefff" stroke="#e2b3ff" stroke-width="2" opacity="0.7">
      <animate attributeName="y" values="145;135;145" dur="2s" repeatCount="indef"/>
    </rect>
    <rect x="192" y="145" width="8" height="15" fill="#ffefff" stroke="#e2b3ff" stroke-width="2" opacity="0.7">
      <animate attributeName="y" values="145;135;145" dur="2s" repeatCount="indef" begin="0.5s"/>
    </rect>
  </g>
  
  <!-- Croissant Tray -->
  <g class="croissant-tray">
    <rect x="280" y="200" width="100" height="25" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="3"/>
    <rect x="285" y="205" width="100" height="15" fill="#f0f0f0" stroke="#c0c0c0" stroke-width="2"/>
  </g>
  
  <!-- Golden Croissants -->
  <g class="croissants">
    <!-- Croissant 1 -->
    <g>
      <path d="M300,215 Q310,205 320,215 T340,215" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M305,218 Q315,208 325,218 T345,218" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M308,220 Q318,210 328,220 T348,220" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
    </g>
    <!-- Croissant 2 -->
    <g>
      <path d="M300,228 Q310,218 320,228 T340,228" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M305,231 Q315,221 325,231 T345,231" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M308,233 Q318,223 328,233 T348,233" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
    </g>
    <!-- Croissant 3 -->
    <g>
      <path d="M300,241 Q310,231 320,241 T340,241" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M305,244 Q315,234 325,244 T345,244" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M308,246 Q318,236 328,246 T348,246" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
    </g>
    <!-- Croissant 4 -->
    <g>
      <path d="M330,215 Q340,205 350,215" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M335,218 Q345,208 355,218" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
      <path d="M338,220 Q348,210 358,220" fill="#ffd9b3" stroke="#ffb966" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Rolling Pin -->
  <g class="rolling-pin">
    <rect x="400" y="280" width="40" height="6" fill="#f5e6d3" stroke="#e0c8a8" stroke-width="2"/>
    <rect x="395" y="275" width="50" height="16" fill="#f0e0c0" stroke="#d0c0a0" stroke-width="2"/>
    <circle cx="410" cy="283" r="3" fill="#fff5e0" stroke="#e8d4b0" stroke-width="1"/>
  </g>
  
  <!-- Kitchen Counter/Work Surface -->
  <rect x="100" y="280" width="300" height="15" fill="#e8f8f0" stroke="#d0e8d0" stroke-width="2"/>
  <rect x="105" y="285" width="300" height="5" fill="#d8f4e8" stroke="#c8e8d8" stroke-width="1"/>
  
  <!-- Background Elements - Kitchen Equipment (No figures) -->
  <rect x="50" y="350" width="30" height="50" fill="#e0f0e0" stroke="#c8d8c8" stroke-width="2"/>
  <rect x="120" y="350" width="25" height="40" fill="#e8f4f0" stroke="#d0e8f0" stroke-width="2"/>
  <rect x="380" y="350" width="35" height="45" fill="#e0f4f0" stroke="#d0e8f0" stroke-width="2"/>
</svg>