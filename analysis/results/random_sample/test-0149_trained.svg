<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @keyframes gentle sway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }
      @keyframes candle flicker {
        0%, 100% { opacity: 0.9; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-1px); }
      }
      @keyframes soft breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      @keyframes isometric drift {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(2px); }
        75% { transform: translateX(-2px); }
      }
      .chandelier-shade {
        animation: gentle sway 8s ease-in-out infinite;
      }
      .candle-flame {
        animation: candle flicker 3s ease-in-out infinite;
      }
      .room-bg {
        animation: soft breathe 15s ease-in-out infinite;
      }
      .armchair {
        animation: isometric drift 12s ease-in-out infinite;
      }
      .table {
        animation: isometric drift 12s ease-in-out infinite reverse;
      }
      .rug {
        animation: isometric drift 16s ease-in-out infinite;
      }
      .drapes {
        animation: gentle sway 6s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Background with evening ambiance -->
  <rect class="room-bg" x="0" y="0" width="512" height="512" fill="#1a1a2e"/>
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#2d4a3e" stroke-width="2" opacity="0.3"/>
  <!-- Isometric floor perspective -->
  <polygon points="256,400 450,320 450,480 256,400" fill="#2d2d44" stroke="#1a1a2e" stroke-width="3"/>
  <polygon points="256,400 50,320 50,480 256,400" fill="#25253a" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Evening sky glow from window area -->
  <ellipse cx="80" cy="150" rx="60" ry="40" fill="#1e3a2f" opacity="0.4"/>
  <ellipse cx="432" cy="160" rx="50" ry="35" fill="#2a3d4a" opacity="0.3"/>
  <!-- Deep green armchair -->
  <g class="armchair">
    <rect x="180" y="280" width="40" height="60" fill="#1a4a3a" stroke="#0f3a2a" stroke-width="4"/>
    <rect x="160" y="300" width="80" height="25" fill="#1a4a3a" stroke="#0f3a2a" stroke-width="3"/>
    <rect x="190" y="260" width="40" height="35" fill="#1a5a4a" stroke="#0f3a2a" stroke-width="4"/>
    <rect x="165" y="290" width="22" height="20" fill="#154535" stroke="#0f3a2a" stroke-width="2"/>
    <rect x="225" y="290" width="22" height="20" fill="#154535" stroke="#0f3a2a" stroke-width="2"/>
  </g>
  <!-- Dark wood side table -->
  <g class="table">
    <rect x="320" y="260" width="35" height="8" fill="#3d3d2e" stroke="#22221a" stroke-width="3"/>
    <rect x="320" y="280" width="35" height="30" fill="#353525" stroke="#22221a" stroke-width="3"/>
    <rect x="335" y="265" width="5" height="15" fill="#2d2d1e" stroke="#1a1a15" stroke-width="2"/>
    <rect x="315" y="270" width="8" height="25" fill="#2d2d1e" stroke="#1a1a15" stroke-width="2"/>
  </g>
  <!-- Muted area rug -->
  <g class="rug">
    <rect x="140" y="340" width="230" height="45" fill="#3d4a4e" stroke="#2a353a" stroke-width="4"/>
    <rect x="160" y="355" width="190" height="15" fill="#3a454a" stroke="#2a353a" stroke-width="2"/>
    <rect x="180" y="365" width="150" height="8" fill="#354045" stroke="#2a353a" stroke-width="2"/>
  </g>
  <!-- Candle chandelier -->
  <g>
    <!-- Chandelier frame -->
    <rect x="256" y="80" width="12" height="60" fill="#2a2a3a" stroke="#1a1a2a" stroke-width="3"/>
    <rect x="245" y="85" width="22" height="8" fill="#2a2a3a" stroke="#1a1a2a" stroke-width="3"/>
    <!-- Chandelier shades -->
    <g class="chandelier-shade">
      <rect x="240" y="95" width="10" height="25" fill="#3d4a5a" stroke="#2a3540" stroke-width="2"/>
      <rect x="272" y="95" width="10" height="25" fill="#3d4a5a" stroke="#2a3540" stroke-width="2"/>
      <rect x="256" y="75" width="18" height="12" fill="#2d3a45" stroke="#1a2535" stroke-width="2"/>
    </g>
    <!-- Candle holder -->
    <rect x="256" y="100" width="8" height="15" fill="#2a1a15" stroke="#1a1010" stroke-width="2"/>
    <!-- Flickering candle flame -->
    <g class="candle-flame">
      <path d="M258,115 Q256,105 254,115 T256,125" fill="#ffcc66" stroke="#ff9933" stroke-width="1"/>
      <ellipse cx="256" cy="110" rx="3" ry="6" fill="#ffcc66" opacity="0.8"/>
      <circle cx="256" cy="108" r="2" fill="#ff6600" opacity="0.6"/>
    </g>
  </g>
  <!-- Additional ambient lighting effects -->
  <circle cx="256" cy="120" r="15" fill="#ffcc66" opacity="0.2"/>
  <circle cx="250" cy="130" r="8" fill="#ff9933" opacity="0.15"/>
  <circle cx="262" cy="125" r="6" fill="#ffcc66" opacity="0.15"/>
  <!-- Subtle room details -->
  <rect x="100" y="380" width="20" height="10" fill="#2a3530" stroke="#1a252a" stroke-width="2" opacity="0.5"/>
  <rect x="390" y="380" width="20" height="10" fill="#2a3530" stroke="#1a252a" stroke-width="2" opacity="0.5"/>
</svg>