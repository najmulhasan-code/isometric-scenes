<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @keyframes spin {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(180deg); }
      }
      @keyframes gentleFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes slightPulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      @keyframes rotateFan {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .fan-blade {
        animation: rotateFan 20s linear infinite;
      }
      .canvas-roll {
        animation: gentleFloat 6s ease-in-out infinite;
      }
      .acrylic-sheet {
        animation: slightPulse 4s ease-in-out infinite;
      }
      .stand {
        animation: gentleFloat 8s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="#e8f4f8"/>
  <!-- Ceiling Fan -->
  <g class="fan-container">
    <rect x="256" y="20" width="16" height="60" fill="#4a5568" stroke="#2d3748" stroke-width="3"/>
    <g class="fan-blade">
      <rect x="230" y="40" width="52" height="15" fill="#e53e3e" stroke="#c53030" stroke-width="2"/>
      <rect x="230" y="110" width="52" height="15" fill="#3182ce" stroke="#1a4d7e" stroke-width="2"/>
      <rect x="230" y="180" width="52" height="15" fill="#63b3ed" stroke="#2b6cb0" stroke-width="2"/>
    </g>
    <rect x="256" y="20" width="60" height="16" fill="#2d3748" stroke="#1a202c" stroke-width="3"/>
  </g>
  <!-- Steel Stand -->
  <g class="stand">
    <!-- Base -->
    <rect x="180" y="320" width="152" height="48" fill="#4a6fa5" stroke="#2b5a8a" stroke-width="4"/>
    <rect x="184" y="324" width="144" height="40" fill="#3a5f9a" stroke="#234d7a" stroke-width="2"/>
    <!-- Legs -->
    <rect x="170" y="320" width="24" height="120" fill="#3a5f9a" stroke="#234d7a" stroke-width="3"/>
    <rect x="318" y="320" width="24" height="120" fill="#3a5f9a" stroke="#234d7a" stroke-width="3"/>
    <rect x="204" y="320" width="24" height="80" fill="#4a6fa5" stroke="#2b5a8a" stroke-width="3"/>
    <rect x="284" y="320" width="24" height="80" fill="#4a6fa5" stroke="#2b5a8a" stroke-width="3"/>
    <!-- Crossbar -->
    <rect x="190" y="340" width="132" height="16" fill="#2b5a8a" stroke="#1a3d6a" stroke-width="2"/>
  </g>
  <!-- Acrylic Sheet -->
  <g class="acrylic-sheet">
    <rect x="200" y="260" width="112" height="80" fill="none" stroke="#a0aec0" stroke-width="8" stroke-dasharray="12,8"/>
    <rect x="204" y="264" width="104" height="72" fill="#e2e8f0" stroke="#718096" stroke-width="2"/>
    <rect x="210" y="270" width="92" height="60" fill="rgba(100,181,246,0.1)" stroke="none"/>
    <!-- Reflection overlay -->
    <rect x="208" y="268" width="88" height="56" fill="rgba(255,255,255,0.3)" opacity="0.5"/>
  </g>
  <!-- Roll of Canvas -->
  <g class="canvas-roll">
    <rect x="320" y="280" width="60" height="40" fill="#f7fafc" stroke="#cbd5e0" stroke-width="3"/>
    <rect x="324" y="284" width="52" height="34" fill="#e2e8f0" stroke="#a0aec0" stroke-width="2"/>
    <!-- Canvas layers (rolled appearance) -->
    <rect x="326" y="286" width="48" height="2" fill="#e53e3e" opacity="0.6"/>
    <rect x="328" y="290" width="44" height="2" fill="#3182ce" opacity="0.5"/>
    <rect x="330" y="294" width="40" height="2" fill="#63b3ed" opacity="0.4"/>
    <rect x="332" y="298" width="36" height="2" fill="#805ad5" opacity="0.4"/>
    <!-- Stand for canvas roll -->
    <rect x="330" y="324" width="32" height="24" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
  </g>
  <!-- Isometric floor perspective -->
  <polygon points="50,450 150,350 362,350 462,450" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="2"/>
  <polygon points="50,450 150,350 200,400 280,380" fill="#e3f2fd" stroke="#bbdefb" stroke-width="1"/>
  <polygon points="362,350 462,450 412,400 312,380" fill="#e3f2fd" stroke="#bbdefb" stroke-width="1"/>
</svg>