<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradients for metallic and pastry effects -->
    <linearGradient id="metalSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#404040"/>
      <stop offset="50%" style="stop-color:#707070"/>
      <stop offset="100%" style="stop-color:#404040"/>
    </linearGradient>
    <linearGradient id="metalTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#707070"/>
      <stop offset="50%" style="stop-color:#A0A0A0"/>
      <stop offset="100%" style="stop-color:#707070"/>
    </linearGradient>
    <linearGradient id="batterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ffccae"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Floor (Isometric Grid) -->
  <g id="floor" transform="translate(150, 300) scale(1, 1) rotate(-25)" filter="url(#softShadow)">
    <line x1="-256" y1="0" x2="256" y2="0" stroke="#555" stroke-width="2"/>
    <line x1="-256" y1="100" x2="256" y2="100" stroke="#444" stroke-width="2"/>
    <line x1="-256" y1="-133.7" x2="0" y2="-133.7" stroke="#333" stroke-width="2"/>
    <line x1="-256" y1="-33.7" x2="0" y2="-33.7" stroke="#333" stroke-width="2"/>
    <line x1="-100" y1="-33.7" x2="0" y2="-33.7" stroke="#444" stroke-width="1"/>
    <line x1="-100" y1="-133.7" x2="0" y2="-133.7" stroke="#444" stroke-width="1"/>
  </g>

  <!-- Rolling Pin (Center Stage) -->
  <g id="rollingPinGroup" transform="translate(320, 320) rotate(-15)" filter="url(#softShadow)">
    <path d="M -20 0 L 20 0" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="18" ry="3" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
    <!-- Texture on pin -->
    <path d="M -18 -2 L -18 3" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
    <path d="M 0 -2 L 0 3" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
    <path d="M 18 -2 L 18 3" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
    <path d="M 6 -2 L 6 2" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
    <path d="M -6 -2 L -6 2" stroke="#8B4513" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Mixer Stand -->
  <g id="mixerStand" transform="translate(100, 300) rotate(-10)">
    <!-- Base -->
    <path d="M -30 0 L 30 0 L 25 20 L -25 20 Z" fill="#7f8c8d" stroke="#555" stroke-width="1"/>
    <!-- Column -->
    <rect x="-5" y="0" width="10" height="15" fill="#95a5a6" stroke="#555" stroke-width="1"/>
  </g>

  <!-- Mixer Bowl -->
  <g id="mixerBowl" transform="translate(100, 305)">
    <ellipse cx="0" cy="0" rx="16" ry="8" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1"/>
    <path d="M 0 -8 L 16 4 A 16 8 0 0 0 -16 4 Z" fill="none" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- Mixer Beaters (Animation Group) -->
  <g id="mixerBeaters" transform="translate(100, 305)">
    <!-- Handle attachment point -->
    <circle cx="1" cy="-8" r="1" fill="#7f8c8d"/>
    
    <!-- Beader 1 (Leading) -->
    <rect x="-14" y="-12" width="4" height="24" fill="#c0392b" rx="1"/>
    <!-- Beader 2 (Trailing) -->
    <rect x="5" y="2" width="4" height="4" fill="#c0392b" rx="1"/>
  </g>

  <!-- Kitchen Counter (Foreground) -->
  <g id="counter" transform="translate(400, 350) rotate(10) translate(-150, 0)">
    <path d="M -80 0 L -80 20 L -30 20 L -30 40" fill="#d3d3d3" stroke="#999" stroke-width="1" />
    <path d="M -80 0 L -150 100 L -150 110 L -40 110" fill="#cfcfcf" stroke="#999" stroke-width="1" transform="translate(0, 40)"/>
  </g>

  <!-- Tray of Croissants -->
  <g id="croissants" transform="translate(260, 330)">
    <!-- Tray Body -->
    <rect x="-40" y="-40" width="80" height="35" fill="url(#batterGradient)" stroke="#c0392b" stroke-width="1"/>
    <!-- Tray Rim -->
    <rect x="-41" y="-41" width="82" height="37" fill="none" stroke="#8B4513" stroke-width="2"/>
    
    <!-- Croissant 1 (Back Left) -->
    <ellipse cx="-25" cy="-10" rx="12" ry="6" transform="rotate(-35)" fill="#f5deb3" stroke="#e6ac89" stroke-width="0.5"/>
    <path d="M -3 0 C -3 20, 12 25, 18 10" fill="none" stroke="#e6ac89" stroke-width="0.5" stroke-linecap="round"/>
    
    <!-- Croissant 2 (Back Right) -->
    <ellipse cx="5" cy="-10" rx="12" ry="6" transform="rotate(-35)" fill="#f5deb3" stroke="#e6ac89" stroke-width="0.5"/>
    <path d="M 13 0 C 13 20, 0 25, -5 10" fill="none" stroke="#e6ac89" stroke-width="0.5" stroke-linecap="round"/>
    
    <!-- Croissant 3 (Front Left) -->
    <ellipse cx="-28" cy="15" rx="13" ry="6" transform="rotate(-25)" fill="#f5deb3" stroke="#e6ac89" stroke-width="0.5"/>
    <path d="M 0 0 C 0 22, 18 26, 22 12" fill="none" stroke="#e6ac89" stroke-width="0.5" stroke-linecap="round"/>
    
    <!-- Croissant 4 (Front Right) -->
    <ellipse cx="-15" cy="22" rx="14" ry="6" transform="rotate(-20)" fill="#f5deb3" stroke="#e6ac89" stroke-width="0.5"/>
    <path d="M 8 0 C 8 24, 22 28, 26 14" fill="none" stroke="#e6ac89" stroke-width="0.5" stroke-linecap="round"/>

    <!-- Toasters/Equipment in background to enhance depth -->
    <path d="M -100 0 L -120 0 L -120 25 L -100 25 Z" fill="#95a5a6" stroke="#666" stroke-width="1"/>
    <rect x="-118" y="20" width="4" height="5" fill="#888"/>
    <rect x="-105" y="20" width="4" height="5" fill="#888"/>
  </g>

  <!-- Floor Visibility Hole (Foreground Clipping) -->
  <ellipse cx="50" cy="300" rx="40" ry="5" fill="none" stroke="#555" stroke-width="2" transform="rotate(-25 50 300)"/>
  <ellipse cx="150" cy="350" rx="40" ry="5" fill="none" stroke="#555" stroke-width="2" transform="rotate(-25 150 350)"/>

  <!-- Window/Outlet (Background detail) -->
  <circle cx="350" cy="150" r="3" fill="#555"/>
  <rect x="345" y="153" width="20" height="30" fill="#444"/>

</svg>