<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .isometric-face { fill: white; stroke: #333; stroke-width: 2; stroke-linejoin: round; }
      .counter-body { fill: #c0c0c0; stroke: #888; stroke-width: 2; }
      .counter-crate { fill: #5d4037; stroke: #3e2723; stroke-width: 2; }
      .cup { fill: #fff9c4; stroke: #fbc02d; stroke-width: 1; }
      .cup-stack { fill: #f9a825; opacity: 0.8; }
      .grinder { fill: #333; stroke: #666; stroke-width: 1; }
      .grinder-handle { fill: #8d6e63; }
      .gears { fill: #333; }
      .clock-face { fill: #f5f5f5; stroke: #ccc; stroke-width: 3; }
      .clock-hand { stroke: #333; stroke-linecap: round; animation: animateClock 12s linear infinite; }
      .clock-hour { stroke: #333; stroke-width: 4; }
      .clock-minute { stroke: #666; stroke-width: 2; }
      .shadow { fill: rgba(0,0,0,0.1); opacity: 0.5; }
    </style>
    
    <!-- Child for animation -->
    <g id="anim-layer">
      <path class="clock-hour" d="M256 150 L240 260" />
      <path class="clock-minute" d="M256 150 L280 200" />
    </g>

    <!-- Child for grinder animation -->
    <g id="grinder-anim">
      <g class="gears" transform="translate(-10, 0)">
        <circle cx="0" cy="0" r="5" />
        <circle cx="5" cy="0" r="5" />
        <circle cx="0" cy="5" r="5" />
        <circle cx="-5" cy="0" r="5" />
      </g>
      <circle class="griders" cx="-5" cy="20" r="4" fill="#999">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.5s" repeatCount="indefinite" />
      </circle>
    </g>
  </defs>

  <!-- Background Floor -->
  <g id="floor">
    <!-- Base shadow -->
    <path class="shadow" d="M128,384 L448,144 L448,448 L128,64 Z" />
    <path class="shadow" d="M128,384 L128,448 L400,448 L400,384 Z" />
    <!-- Isometric grid lines (subtle) -->
    <g stroke="#a0a0a0" stroke-width="1">
      <line x1="0" y1="0" x2="300" y2="300" stroke-dasharray="20 20" />
      <line x1="0" y1="300" x2="300" y2="0" />
    </g>
  </g>

  <!-- Old-fashioned Chrome Counter -->
  <g id="counter">
    <!-- Crate base -->
    <path class="counter-crate" d="M200,400 L350,280 L350,400 L200,400 Z" />
    <!-- Top surface shadow -->
    <path d="M200,350 L350,230 L350,350 L200,350 Z" fill="rgba(0,0,0,0.1)" />
    
    <!-- Chrome Counter Top -->
    <path class="counter-body" d="M200,350 L380,140 L380,360 L200,350 Z" />
    <!-- Chrome Reflections -->
    <path class="counter-body" d="M200,350 L380,220 L380,360 L200,350 Z" />
    <path class="counter-body" d="M200,350 L280,180 L280,360 L200,350 Z" />
    <!-- Bolts -->
    <circle cx="200" cy="350" r="2" fill="#555" />
    <circle cx="380" cy="220" r="1.5" fill="#555" />
  </g>

  <!-- Vintage Wall Clock -->
  <g id="clock">
    <!-- Wall mount bracket -->
    <rect x="420" y="120" width="40" height="10" transform="rotate(-15 420 120)" fill="#333" />
    <!-- Main Face -->
    <circle class="clock-face" cx="360" cy="200" r="80" />
    <circle class="clock-face" cx="360" cy="200" r="70" fill="none" stroke="#ddd" stroke-width="2" />
    
    <!-- Brackets -->
    <rect x="310" y="180" width="40" height="4" transform="rotate(-15 320 190)" fill="#888" />
    <rect x="340" y="160" width="20" height="4" transform="rotate(-15 350 165)" fill="#888" />
    <rect x="340" y="220" width="20" height="4" transform="rotate(-15 350 225)" fill="#888" />
    
    <!-- Time -->
    <text x="360" y="180" text-anchor="middle" font-size="40" fill="#999" font-family="serif">10:10</text>
  </g>

  <!-- Stack of Paper Cups -->
  <g id="cups">
    <g transform="translate(250, 320)">
      <g class="cup">
        <path class="cup" d="M-40,-300 L-60,-350 L60,-350 L40,-300 Z" />
      </g>
      <g class="cup" transform="translate(20,0) scale(0.95,0.95)">
        <path class="cup" d="M-36,-260 L-54,-320 L54,-320 L36,-260 Z" />
      </g>
      <g class="cup" transform="translate(-20,10) scale(0.9) translate(-40,-15) scale(0.95,0.95)">
        <path class="cup" d="M-32,-220 L-50,-280 L50,-280 L32,-220 Z" />
        <circle cx="0" cy="0" r="5" fill="#333" />
      </g>
    </g>
    <!-- Cup Handles -->
    <path class="cup-stack" d="M-42,-320 L54,-320 L46,-500 L-18,-500 Z" />
  </g>

  <!-- Rotary Coffee Grinder -->
  <g id="grinder" transform="translate(360, 240)">
    <!-- Base -->
    <rect x="-45" y="-20" width="90" height="20" fill="#888" />
    <rect x="-45" y="0" width="90" height="20" fill="#666" />
    <rect x="-42" y="-25" width="84" height="25" fill="#555" stroke="#333" />
    
    <!-- Top Lid -->
    <circle cx="0" cy="-50" r="25" fill="#ccc" stroke="#999" stroke-width="2" />
    <circle cx="0" cy="-50" r="15" fill="#fff" stroke="#ddd" stroke-width="1" />
    
    <!-- Handle (Dial) -->
    <g>
      <rect x="-55" y="-65" width="30" height="60" fill="#795548" stroke="#5d4037" stroke-width="2" />
      <rect x="-55" y="-65" width="30" height="60" fill="transparent" stroke="#5d4037" stroke-width="1"/>
      <!-- Grip part -->
      <rect x="-55" y="-70" width="30" height="10" fill="#8d6e63" />
      <!-- Round part over handle -->
      <ellipse cx="0" cy="-25" rx="15" ry="25" fill="#795548" stroke="#5d4037" />
    </g>
    
    <!-- Feeding Slot -->
    <rect x="-25" y="-80" width="50" height="10" fill="#333" transform="rotate(-15)" />
    
    <!-- Gears Animation Group -->
    <use href="#grinder-anim" transform="translate(0,0)" />
  </g>

</svg>