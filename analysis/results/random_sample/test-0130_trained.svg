<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @keyframes sway {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
      }
      @keyframes gentleFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes moonPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.95; }
      }
      @keyframes shelfGlow {
        0%, 100% { filter: drop-shadow(0 0 2px silver); }
        50% { filter: drop-shadow(0 0 4px silver); }
      }
      @keyframes gentleBreathe {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(1.02); }
      }
      .swaying {
        animation: sway 6s ease-in-out infinite;
      }
      .floating {
        animation: gentleFloat 8s ease-in-out infinite;
      }
      .pulsing {
        animation: moonPulse 12s ease-in-out infinite;
      }
      .glowing {
        animation: shelfGlow 10s ease-in-out infinite;
      }
      .breathing {
        animation: gentleBreathe 15s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Background with full moon -->
  <rect width="512" height="512" fill="#0a0f1a"/>
  <!-- Full moon -->
  <circle class="pulsing" cx="380" cy="80" r="45" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="3"/>
  <!-- Moon glow -->
  <circle class="pulsing" cx="380" cy="80" r="65" fill="none" stroke="#d8d8d8" stroke-width="1" opacity="0.4"/>
  <!-- Isometric bathroom floor -->
  <polygon points="256,400 480,320 480,120 256,200 32,320 32,120" fill="#1a2a3a" stroke="#2a3a4a" stroke-width="2"/>
  <!-- Glass shelf base -->
  <rect x="180" y="180" width="150" height="12" fill="#3a4a5a" stroke="#4a5a6a" stroke-width="2" class="breathing"/>
  <!-- Glass shelf top (translucent) -->
  <rect x="190" y="160" width="130" height="8" fill="none" stroke="#8a9aa" stroke-width="2" stroke-dasharray="5,3" class="glowing"/>
  <!-- Silver items on shelf (animated gently) -->
  <rect class="floating" x="200" y="155" width="20" height="6" fill="#c0c0d0" stroke="#d0d0e0" stroke-width="1"/>
  <circle class="floating" cx="240" cy="158" r="8" fill="#e8e8f8" stroke="#f0f0fc" stroke-width="1"/>
  <rect class="floating" x="270" y="157" width="15" height="7" fill="#d0d0e0" stroke="#e0e0f0" stroke-width="1"/>
  <!-- Hanging lantern (swaying) -->
  <g class="swaying">
    <!-- Lantern rope -->
    <line x1="320" y1="100" x2="320" y2="60" stroke="#2a2a3a" stroke-width="3"/>
    <!-- Lantern body -->
    <rect x="305" y="55" width="30" height="25" fill="#2a3a2a" stroke="#3a4a3a" stroke-width="2"/>
    <!-- Lantern glass -->
    <rect x="308" y="62" width="24" height="12" fill="#4a5a6a" stroke="#5a6a7a" stroke-width="1"/>
    <!-- Lantern light inside -->
    <circle cx="320" cy="68" r="5" fill="#f5f5f5" opacity="0.8"/>
  </g>
  <!-- Porcelain sink -->
  <g class="breathing">
    <!-- Sink basin -->
    <path d="M220,240 Q256,230 292,240 L292,270 Q256,280 220,270 Z" fill="#e8f0f8" stroke="#d0e0f0" stroke-width="2"/>
    <!-- Sink rim -->
    <rect x="215" y="235" width="82" height="10" fill="#f8f8fc" stroke="#e8f0f8" stroke-width="1"/>
    <!-- Sink shadow -->
    <ellipse cx="256" cy="275" rx="35" ry="8" fill="#d0d0e0" opacity="0.3"/>
  </g>
  <!-- Teal towel hanging -->
  <g class="swaying">
    <!-- Towel rod -->
    <rect x="280" y="200" width="50" height="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <!-- Teal towel -->
    <rect x="275" y="205" width="60" height="35" fill="#0a8a7a" stroke="#0a8a7a" stroke-width="0.5" stroke-dasharray="2,2"/>
    <!-- Towel folds -->
    <rect x="282" y="210" width="15" height="8" fill="#0a9a8a" opacity="0.7"/>
    <rect x="295" y="215" width="12" height="6" fill="#0a8a9a" opacity="0.6"/>
  </g>
  <!-- Subtle floor patterns -->
  <rect x="50" y="140" width="10" height="10" fill="#152535" opacity="0.3"/>
  <rect x="150" y="160" width="10" height="10" fill="#152535" opacity="0.3"/>
  <rect x="350" y="150" width="10" height="10" fill="#152535" opacity="0.3"/>
  <rect x="420" y="180" width="10" height="10" fill="#152535" opacity="0.3"/>
</svg>