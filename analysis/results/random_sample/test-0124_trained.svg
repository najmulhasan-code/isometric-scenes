<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <style>
      @keyframes gentleRotate {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(180deg); }
      }
      @keyframes slightTilt {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(4px) rotate(2deg); }
      }
      @keyframes subtlePulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes gentleSlide {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      .coffee-grinder {
        animation: gentleRotate 12s linear infinite;
      }
      .counter-main {
        animation: slightTilt 8s ease-in-out infinite;
      }
      .clock-face {
        animation: subtlePulse 6s ease-in-out infinite;
      }
      .cup-stack {
        animation: gentleSlide 10s ease-in-out infinite;
      }
      .grinder-body {
        animation: gentleRotate 6s linear infinite reverse;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" fill="#e8f4f8"/>
  <!-- Isometric floor/grid -->
  <polygon points="256,400 448,256 448,384 256,528 64,384 64,256" fill="#dce6e8" stroke="#c5d8e0" stroke-width="3"/>
  <polygon points="256,400 448,256 448,384 256,528 64,384 64,256" fill="none" stroke="#c5d8e0" stroke-width="2" opacity="0.6"/>
  <!-- Isometric counter base -->
  <polygon class="counter-main" points="120,280 392,280 392,420 120,420" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="4"/>
  <!-- Counter top (chrome effect) -->
  <polygon class="counter-main" points="140,260 372,260 372,400 140,400" fill="#e8e8e8" stroke="#ffffff" stroke-width="2"/>
  <!-- Chrome highlights on counter -->
  <polygon class="counter-main" points="145,265 367,265 367,390 145,390" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <!-- Rotary coffee grinder -->
  <rect class="coffee-grinder" x="200" y="285" width="60" height="70" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="3"/>
  <rect class="coffee-grinder" x="208" y="295" width="44" height="50" fill="#e0e0e0" stroke="#c0c0c0" stroke-width="2"/>
  <circle class="coffee-grinder" cx="230" cy="310" r="8" fill="#d0d0d0" stroke="#a0a0a0" stroke-width="2"/>
  <circle class="coffee-grinder" cx="230" cy="315" r="5" fill="#c0c0c0" stroke="#909090" stroke-width="1"/>
  <rect class="grinder-body" x="195" y="280" width="70" height="10" fill="#b0b0b0" stroke="#909090" stroke-width="2"/>
  <!-- Coffee grinder grating/blade area -->
  <rect x="210" y="320" width="40" height="15" fill="#d5d5d5" stroke="#c5c5c5" stroke-width="1"/>
  <rect x="215" y="325" width="30" height="5" fill="#e5e5e5" stroke="#d0d0d0" stroke-width="0.5"/>
  <rect x="220" y="330" width="20" height="5" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="212" y="335" width="28" height="5" fill="#e0e0e0" stroke="#d0d0d0" stroke-width="0.5"/>
  <!-- Cup stack holder -->
  <rect x="280" y="290" width="40" height="25" fill="#d0d0d0" stroke="#b0b0b0" stroke-width="2"/>
  <!-- Vintage wall clock -->
  <rect class="clock-face" x="320" y="120" width="80" height="90" fill="#f5f5f5" stroke="#c0c0c0" stroke-width="3"/>
  <rect class="clock-face" x="330" y="130" width="60" height="70" fill="#e8f4f8" stroke="#d0d0d0" stroke-width="2"/>
  <!-- Clock hands -->
  <rect x="345" y="165" width="6" height="25" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="1"/>
  <rect x="355" y="145" width="4" height="18" fill="#d0d0d0" stroke="#b0b0b0" stroke-width="0.5"/>
  <!-- Clock numbers/branding -->
  <rect x="325" y="125" width="10" height="4" fill="#b0b0b0" opacity="0.5"/>
  <rect x="357" y="125" width="10" height="4" fill="#b0b0b0" opacity="0.5"/>
  <rect x="325" y="145" width="8" height="3" fill="#a0a0a0" opacity="0.4"/>
  <rect x="357" y="145" width="8" height="3" fill="#a0a0a0" opacity="0.4"/>
  <!-- Paper cups stack -->
  <g class="cup-stack">
    <rect x="260" y="240" width="18" height="35" fill="#fff5e6" stroke="#ffe0b5" stroke-width="2"/>
    <rect x="275" y="245" width="18" height="30" fill="#fff0d4" stroke="#ffdbb3" stroke-width="1.5"/>
    <rect x="290" y="250" width="18" height="25" fill="#fff8dc" stroke="#ffdab8" stroke-width="1"/>
    <rect x="272" y="255" width="14" height="20" fill="#fffdd0" stroke="#ffe8b3" stroke-width="0.8"/>
  </g>
  <!-- Chrome accents and details -->
  <rect x="130" y="260" width="8" height="60" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="1"/>
  <rect x="365" y="260" width="8" height="60" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="1"/>
  <circle cx="256" cy="420" r="15" fill="#d0d0d0" stroke="#b0b0b0" stroke-width="2"/>
  <!-- Shadow elements -->
  <ellipse cx="256" cy="435" rx="80" ry="10" fill="#b0c4de" opacity="0.3"/>
  <ellipse cx="280" cy="425" rx="15" ry="8" fill="#b0c4de" opacity="0.2"/>
  <ellipse cx="340" cy="428" rx="12" ry="6" fill="#b0c4de" opacity="0.2"/>
</svg>