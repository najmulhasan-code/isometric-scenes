<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <style>
      @keyframes slowSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gentleBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes gentleSwing {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
      }
      @keyframes steamRise {
        0% { transform: translateY(0) scale(1); opacity: 0.6; }
        100% { transform: translateY(-20px) scale(1.2); opacity: 0.3; }
      }
      @keyframes jarShimmer {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.1); }
      }
      .fan-blade {
        animation: slowSpin 12s linear infinite;
      }
      .fan-hub {
        animation: gentleSwing 8s ease-in-out infinite;
      }
      .urn-glass {
        animation: gentleBounce 4s ease-in-out infinite;
      }
      .steam {
        animation: steamRise 3s ease-in-out infinite;
      }
      .jar {
        animation: jarShimmer 6s ease-in-out infinite;
      }
      .scale-plate {
        animation: gentleBounce 5s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" fill="#f5f5f0"/>
  <!-- Isometric floor -->
  <polygon points="256,150 420,250 420,350 256,450 84,350 84,250" fill="#e8e8d8" stroke="#d4d4c8" stroke-width="4"/>
  <!-- Ceiling area -->
  <rect x="100" y="50" width="312" height="80" fill="#faf8f0" stroke="#e8e8f0" stroke-width="3"/>
  <!-- Ceiling fan hub -->
  <g class="fan-hub">
    <circle cx="256" cy="90" r="25" fill="#6b8e8e" stroke="#4a6b6b" stroke-width="3"/>
    <circle cx="256" cy="90" r="8" fill="#8fbb8f" stroke="#6b966b" stroke-width="2"/>
  </g>
  <!-- Ceiling fan blades (3 blades) -->
  <g>
    <rect x="200" y="70" width="60" height="12" class="fan-blade" fill="#5a7a7a" stroke="#4a6060" stroke-width="2"/>
    <rect x="312" y="70" width="60" height="12" class="fan-blade" fill="#5a7a7a" stroke="#4a6060" stroke-width="2"/>
    <rect x="256" y="110" width="48" height="10" class="fan-blade" fill="#5a7a7a" stroke="#4a6060" stroke-width="2"/>
  </g>
  <!-- Coffee counter base -->
  <rect x="84" y="250" width="344" height="200" fill="#e6d5b8" stroke="#c4b898" stroke-width="5"/>
  <!-- Counter front edge -->
  <rect x="84" y="450" width="344" height="10" fill="#d4c8a8" stroke="#c0b890" stroke-width="2"/>
  <!-- Copper coffee urn -->
  <g class="urn-glass">
    <!-- Urn base -->
    <rect x="160" y="280" width="60" height="25" fill="#c9a87d" stroke="#b8986d" stroke-width="3"/>
    <!-- Urn body -->
    <rect x="155" y="250" width="70" height="45" fill="#d4b88d" stroke="#c4a87d" stroke-width="3"/>
    <!-- Urn spout -->
    <polygon points="205,250 225,240 230,255 210,265" fill="#e8c89d" stroke="#d4b88d" stroke-width="2"/>
    <!-- Urn handle -->
    <rect x="185" y="265" width="20" height="25" fill="#e0c89d" stroke="#d4b88d" stroke-width="2"/>
    <!-- Glass front panel -->
    <rect x="165" y="255" width="50" height="35" fill="none" stroke="#b8c8d8" stroke-width="2"/>
    <!-- Steam rises -->
    <g class="steam">
      <ellipse cx="175" cy="240" rx="8" ry="5" fill="white" opacity="0.6"/>
      <ellipse cx="185" cy="235" rx="6" ry="4" fill="white" opacity="0.5"/>
      <ellipse cx="195" cy="245" rx="7" ry="5" fill="white" opacity="0.4"/>
      <ellipse cx="170" cy="238" rx="5" ry="3" fill="white" opacity="0.5"/>
      <ellipse cx="190" cy="242" rx="6" ry="4" fill="white" opacity="0.6"/>
    </g>
  </g>
  <!-- Row of glass jars (5 jars) -->
  <g class="jar">
    <!-- Jar 1 -->
    <rect x="220" y="280" width="25" height="60" fill="#f0e6d2" stroke="#d4c8a8" stroke-width="2"/>
    <rect x="220" y="280" width="25" height="15" fill="#e8d4b2" stroke="#c4b898" stroke-width="1"/>
    <rect x="222" y="275" width="21" height="5" fill="#f5e8d8" stroke="#d4c8a8" stroke-width="1"/>
    <!-- Jar 2 -->
    <rect x="255" y="280" width="25" height="60" fill="#f0e6d2" stroke="#d4c8a8" stroke-width="2"/>
    <rect x="255" y="280" width="25" height="15" fill="#e8d4b2" stroke="#c4b898" stroke-width="1"/>
    <rect x="257" y="275" width="21" height="5" fill="#f5e8d8" stroke="#d4c8a8" stroke-width="1"/>
    <!-- Jar 3 -->
    <rect x="290" y="280" width="25" height="60" fill="#f0e6d2" stroke="#d4c8a8" stroke-width="2"/>
    <rect x="290" y="280" width="25" height="15" fill="#e8d4b2" stroke="#c4b898" stroke-width="1"/>
    <rect x="292" y="275" width="21" height="5" fill="#f5e8d8" stroke="#d4c8a8" stroke-width="1"/>
    <!-- Jar 4 -->
    <rect x="325" y="280" width="25" height="60" fill="#f0e6d2" stroke="#d4c8a8" stroke-width="2"/>
    <rect x="325" y="280" width="25" height="15" fill="#e8d4b2" stroke="#c4b898" stroke-width="1"/>
    <rect x="327" y="275" width="21" height="5" fill="#f5e8d8" stroke="#d4c8a8" stroke-width="1"/>
    <!-- Jar 5 -->
    <rect x="360" y="280" width="25" height="60" fill="#f0e6d2" stroke="#d4c8a8" stroke-width="2"/>
    <rect x="360" y="280" width="25" height="15" fill="#e8d4b2" stroke="#c4b898" stroke-width="1"/>
    <rect x="362" y="275" width="21" height="5" fill="#f5e8d8" stroke="#d4c8a8" stroke-width="1"/>
  </g>
  <!-- Vintage scale -->
  <g class="scale-plate">
    <!-- Scale base -->
    <rect x="400" y="300" width="40" height="20" fill="#d4c8a8" stroke="#c4b898" stroke-width="2"/>
    <!-- Scale bowl -->
    <ellipse cx="420" cy="325" rx="20" ry="12" fill="#e8d4b2" stroke="#d4c8a8" stroke-width="2"/>
    <!-- Scale handle/arm -->
    <rect x="390" y="290" width="30" height="15" fill="#c4b898" stroke="#b4a888" stroke-width="2"/>
    <!-- Scale pivot -->
    <circle cx="410" cy="295" r="5" fill="#f0e6d2" stroke="#e8d4b2" stroke-width="2"/>
    <!-- Scale weight -->
    <rect x="435" y="330" width="10" height="15" fill="#d4c8a8" stroke="#c4b898" stroke-width="2"/>
  </g>
  <!-- Counter items shadows -->
  <ellipse cx="180" cy="465" rx="25" ry="5" fill="rgba(0,0,0,0.1)" opacity="0.5"/>
  <ellipse cx="230" cy="465" rx="12" ry="4" fill="rgba(0,0,0,0.1)" opacity="0.5"/>
  <ellipse cx="260" cy="465" rx="12" ry="4" fill="rgba(0,0,0,0.1)" opacity="0.5"/>
  <ellipse cx="295" cy="465" rx="12" ry="4" fill="rgba(0,0,0,0.1)" opacity="0.5"/>
  <ellipse cx="330" cy="465" rx="12" ry="4" fill="rgba(0,0,0,0.1)" opacity="0.5"/>
  <ellipse cx="365" cy="465" rx="12" ry="4" fill="rgba(0,0,0,0.1)" opacity="0.5"/>
  <ellipse cx="420" cy="460" rx="18" ry="4" fill="rgba(0,0,0,0.1)" opacity="0.4"/>
  <!-- Subtle ambient light effect -->
  <rect x="256" y="20" width="200" height="40" fill="rgba(255,255,255,0.1)" opacity="0.3"/>
</svg>