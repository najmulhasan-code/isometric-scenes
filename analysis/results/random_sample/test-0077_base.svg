<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fog/Mist Gradient -->
    <radialGradient id="fogGradient" cx="0" cy="0" r="1" fx="0" fy="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Soft blue-grey darken for ground -->
    <linearGradient id="groundGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#556b73"/>
      <stop offset="60%" stop-color="#384b50"/>
      <stop offset="100%" stop-color="#2c3e40"/>
    </linearGradient>
    
    <!-- Damp metal gradients -->
    <linearGradient id="ironGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    
    <linearGradient id="trayGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Cabinet gradients -->
    <linearGradient id="chestGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="doorGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#576574"/>
      <stop offset="100%" stop-color="#2c3e40"/>
    </linearGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer (Wall Shadow) -->
  <rect x="-100" y="-100" width="712" height="712" fill="#0f172a" />

  <!-- Isometric Ground Elements (Floors of room sections) -->
  <!-- Back Wall Floor -->
  <polygon points="100,260 410,260 400,450 320,450" fill="url(#fogGradient)" stroke="#334155" stroke-width="2" />
  <!-- Left Wall Floor -->
  <polygon points="100,260 100,500 -20,460" fill="url(#groundGradient)" stroke="#334155" stroke-width="2" />
  <!-- Right Wall Floor -->
  <polygon points="410,260 690,260 640,500" fill="url(#groundGradient)" stroke="#334155" stroke-width="2" />

  <!-- Main Floor Surface -->
  <rect x="100" y="260" width="300" height="240" fill="url(#groundGradient)" stroke="#334155" stroke-width="4"/>
  <!-- Floor details (grime/scuff) -->
  <path d="M100,350 Q120,350 120,370 Q120,380 100,380 Z" fill="#334155" opacity="0.5"/>
  <path d="M500,280 Q510,300 510,330 Q510,320 500,320 Z" fill="#475569" opacity="0.5"/>

  <!-- Cabinet on the Left (Dark, wooden texture implied) -->
  <path d="M-20,400 -20,500 50,500 50,400" fill="url(#chestGradient)" stroke="#1e293b" stroke-width="2"/>
  <!-- Cabinet Handle Area -->
  <ellipse cx="25" cy="415" rx="40" ry="6" fill="#475569" opacity="0.8"/>
  
  <!-- Cabinet Door / Side on the Front Left -->
  <path d="M100,290 140,290 150,460 120,460 Z" fill="url(#doorGradient)" stroke="#334155" stroke-width="2"/>
  
  <!-- Cabinet Door on Front Right -->
  <path d="M410,290 410,460 430,460 430,290 Z" fill="url(#doorGradient)" stroke="#334155" stroke-width="2"/>

  <!-- Cabinet Top Surface (Floor edge connection) -->
  <path d="M-20,400 50,320 120,320" fill="url(#groundGradient)" stroke="#334155" stroke-width="2"/>
  
  <!-- Smoker Top (Cabinet) -->
  <rect x="-60" y="280" width="120" height="60" fill="#334155" stroke="#2c3e40" stroke-width="2"/>

  <!-- Workbench on the Right -->
  <rect x="400" y="290" width="100" height="160" fill="#475569" stroke="#334155" stroke-width="2"/>
  <!-- Top Edge of Bench -->
  <path d="M400,290 450,290 450,280 400,280 Z" fill="#64748b"/>
  
  <!-- The Metal Tray -->
  <rect x="435" y="370" width="60" height="35" fill="url(#trayGradient)" stroke="#0f172a" stroke-width="2"/>
  <!-- Tray Rim Detail -->
  <rect x="438" y="380" width="60" height="22" fill="#94a3b8" opacity="0.6"/>
  
  <!-- The Soldering Iron -->
  <!-- Handle -->
  <rect x="455" y="388" width="8" height="25" rx="2" fill="#c69925" /> <!-- Wooden handle -->
  <!-- Main Body (Metal) -->
  <rect x="463" y="365" width="12" height="45" rx="2" fill="url(#ironGradient)" />
  <!-- Iron Tip -->
  <circle cx="475" cy="405" r="6" fill="#475569" opacity="0.5" />
  
  <!-- Stylized Vapor / Vapor rising from iron -->
  <!-- Group for animation -->
  <g id="vaporGroup1">
    <path d="M470,410 Q465,430 455,435 Q465,440 470,420" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <path d="M470,410 Q460,420 450,425" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-opacity="0.1"/>
  </g>
  
  <g id="vaporGroup2">
    <path d="M380,200 Q375,220 380,230 Q375,240 370,230" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <path d="M400,200 Q410,210 415,225 Q405,235 395,225" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-opacity="0.1"/>
  </g>
  
  <g id="vaporGroup3" opacity="0.6">
    <path d="M300,350 Q290,365 300,375 Q295,385 290,370" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  </g>

  <!-- Light Source (Faint glow from smoke) -->
  <circle cx="470" cy="415" r="40" fill="white" opacity="0.15" filter="url(#softBlur)" />
  <circle cx="470" cy="415" r="30" fill="white" opacity="0.08" />

</svg>