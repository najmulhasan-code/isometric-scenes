<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @keyframes snowfall {
        0%, 100% { transform: translateY(0) translateX(0); }
        25% { transform: translateY(-20px) translateX(5px); }
        50% { transform: translateY(-10px) translateX(-3px); }
        75% { transform: translateY(-15px) translateX(2px); }
      }
      @keyframes gentleBreeze {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes softGlow {
        0%, 100% { opacity: 0.3; filter: brightness(1); }
        50% { opacity: 0.5; filter: brightness(1.2); }
      }
      @keyframes snowSwirl {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        25% { transform: rotate(5deg) translateY(-5px); }
        50% { transform: rotate(-3deg) translateY(3px); }
        75% { transform: rotate(2deg) translateY(-3px); }
      }
      @keyframes platformShift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(1px); }
      }
      .snowflake {
        animation: snowfall 8s ease-in-out infinite;
      }
      .breeze {
        animation: gentleBreeze 4s ease-in-out infinite;
      }
      .glow {
       animation: softGlow 6s ease-in-out infinite;
      }
      .platform {
        animation: platformShift 12s ease-in-out infinite;
      }
      .shelter-wind {
        animation: gentleBreeze 7s ease-in-out infinite;
      }
      .bench-vibration {
        animation: platformShift 9s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Background Sky (Twilight) -->
  <rect x="0" y="0" width="512" height="512" class="glow" fill="linear-gradient(to bottom, #1a1a2e, #16213e, #0f3460)"/>
  <!-- Distant Moon -->
  <circle cx="380" cy="80" r="25" fill="#f5f5f5" opacity="0.8"/>
  <!-- Storey Mountains -->
  <polygon points="0,280 120,180 240,260 360,140 480,220 512,280 512,512 0,512" fill="#1a1a2e" opacity="0.7"/>
  <!-- Platform Base -->
  <rect x="50" y="320" width="412" height="190" class="platform" fill="#2d3436" stroke="#4a5568" stroke-width="4"/>
  <!-- Platform Top Surface -->
  <rect x="60" y="330" width="392" height="170" fill="#3a4a5a" opacity="0.9"/>
  <!-- Snow accumulation on platform -->
  <polygon points="60,330 80,320 100,335 120,325 140,340 160,330 180,345 200,328 220,342 240,332 260,348 280,335 300,345 320,330 340,350 360,338 380,345 400,332 420,342 440,335 460,348 480,330" fill="#e8f4f8"/>
  <!-- Lone Bench -->
  <rect x="180" y="360" width="80" height="20" class="bench-vibration" fill="#5a6b7c"/>
  <rect x="185" y="375" width="70" height="8" fill="#4a5a6a" opacity="0.8"/>
  <polygon points="165,360 180,355 180,375 165,380" fill="#6a7a8a" opacity="0.7"/>
  <polygon points="335,360 350,355 350,375 335,380" fill="#6a7a8a" opacity="0.7"/>
  <rect x="200" y="380" width="12" height="15" fill="#3a4a5a" opacity="0.6"/>
  <rect x="280" y="380" width="12" height="15" fill="#3a4a5a" opacity="0.6"/>
  <!-- Frosted Shelter -->
  <rect x="300" y="280" width="60" height="80" class="shelter-wind" fill="#2a3a4a" stroke="#4a5a6a" stroke-width="3"/>
  <polygon points="300,280 330,280 330,270 300,270" fill="#3a4a5a" opacity="0.6"/>
  <polygon points="305,285 325,285 325,275 305,275" fill="#4a5a6a" opacity="0.5"/>
  <!-- Frost effect on shelter -->
  <polygon points="310,280 315,285 320,280 315,275 310,280" fill="#e8f4f8" opacity="0.4"/>
  <polygon points="320,280 325,285 330,280 325,275 320,280" fill="#e8f4f8" opacity="0.3"/>
  <!-- Snow Drifts around shelter -->
  <circle cx="290" cy="300" r="15" fill="#e8f4f8" opacity="0.6"/>
  <circle cx="310" cy="290" r="12" fill="#e8f4f8" opacity="0.5"/>
  <circle cx="320" cy="305" r="10" fill="#e8f4f8" opacity="0.4"/>
  <!-- Swirling Snow (multiple layers) -->
  <g class="snowflake">
    <circle cx="50" cy="250" r="2" fill="white" opacity="0.7"/>
    <circle cx="70" cy="240" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="90" cy="255" r="2" fill="white" opacity="0.7"/>
    <circle cx="110" cy="245" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <g class="snowflake" style="animation-delay: 1s;">
    <circle cx="150" cy="260" r="2" fill="white" opacity="0.7"/>
    <circle cx="170" cy="250" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="190" cy="265" r="2" fill="white" opacity="0.7"/>
    <circle cx="210" cy="255" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <g class="snowflake" style="animation-delay: 2s;">
    <circle cx="250" cy="240" r="2" fill="white" opacity="0.7"/>
    <circle cx="270" cy="250" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="290" cy="245" r="2" fill="white" opacity="0.7"/>
    <circle cx="310" cy="255" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <g class="snowflake" style="animation-delay: 3s;">
    <circle cx="350" cy="250" r="2" fill="white" opacity="0.7"/>
    <circle cx="370" cy="240" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="390" cy="255" r="2" fill="white" opacity="0.7"/>
    <circle cx="410" cy="245" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <g class="snowflake" style="animation-delay: 4s;">
    <circle cx="450" cy="260" r="2" fill="white" opacity="0.7"/>
    <circle cx="470" cy="250" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="490" cy="265" r="2" fill="white" opacity="0.7"/>
    <circle cx="510" cy="255" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <g class="snowflake" style="animation-delay: 5s;">
    <circle cx="80" cy="270" r="2" fill="white" opacity="0.7"/>
    <circle cx="100" cy="260" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="120" cy="275" r="2" fill="white" opacity="0.7"/>
    <circle cx="140" cy="265" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <g class="snowflake" style="animation-delay: 6s;">
    <circle cx="180" cy="280" r="2" fill="white" opacity="0.7"/>
    <circle cx="200" cy="270" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="220" cy="285" r="2" fill="white" opacity="0.7"/>
    <circle cx="240" cy="275" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <g class="snowflake" style="animation-delay: 7s;">
    <circle cx="280" cy="270" r="2" fill="white" opacity="0.7"/>
    <circle cx="300" cy="280" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="320" cy="265" r="2" fill="white" opacity="0.7"/>
    <circle cx="340" cy="275" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <!-- Additional swirling snow groups for dynamic effect -->
  <g class="snowBreeze">
    <circle cx="130" cy="230" r="1.5" fill="white" opacity="0.5" class="breeze"/>
    <circle cx="160" cy="235" r="1" fill="white" opacity="0.4" class="breeze"/>
    <circle cx="200" cy="225" r="1.5" fill="white" opacity="0.5" class="breeze"/>
    <circle cx="230" cy="240" r="1" fill="white" opacity="0.4" class="breeze"/>
  </g>
  <g class="snowBreeze" style="animation-delay: 0.5s;">
    <circle cx="260" cy="220" r="1.5" fill="white" opacity="0.5" class="breeze"/>
    <circle cx="290" cy="225" r="1" fill="white" opacity="0.4" class="breeze"/>
    <circle cx="320" cy="215" r="1.5" fill="white" opacity="0.5" class="breeze"/>
    <circle cx="350" cy="230" r="1" fill="white" opacity="0.4" class="breeze"/>
  </g>
  <g class="snowBreeze" style="animation-delay: 1.5s;">
    <circle cx="380" cy="230" r="1.5" fill="white" opacity="0.5" class="breeze"/>
    <circle cx="410" cy="225" r="1" fill="white" opacity="0.4" class="breeze"/>
    <circle cx="440" cy="235" r="1.5" fill="white" opacity="0.5" class="breeze"/>
    <circle cx="470" cy="240" r="1" fill="white" opacity="0.4" class="breeze"/>
  </g>
  <!-- Wind lines (subtle) -->
  <g class="breeze">
    <rect x="20" y="200" width="2" height="10" fill="white" opacity="0.2"/>
    <rect x="60" y="210" width="2" height="8" fill="white" opacity="0.2"/>
    <rect x="100" y="205" width="2" height="12" fill="white" opacity="0.2"/>
    <rect x="140" y="215" width="2" height="10" fill="white" opacity="0.2"/>
    <rect x="180" y="200" width="2" height="8" fill="white" opacity="0.2"/>
    <rect x="220" y="210" width="2" height="12" fill="white" opacity="0.2"/>
    <rect x="260" y="205" width="2" height="10" fill="white" opacity="0.2"/>
    <rect x="300" y="215" width="2" height="8" fill="white" opacity="0.2"/>
    <rect x="340" y="200" width="2" height="12" fill="white" opacity="0.2"/>
    <rect x="380" y="210" width="2" height="10" fill="white" opacity="0.2"/>
    <rect x="420" y="205" width="2" height="8" fill="white" opacity="0.2"/>
    <rect x="460" y="215" width="2" height="12" fill="white" opacity="0.2"/>
  </g>
  <!-- Subtle snow accumulation on shelter roof -->
  <rect x="305" y="270" width="50" height="5" fill="#e8f4f8" opacity="0.6" class="shelter-wind"/>
  <rect x="310" y="268" width="40" height="3" fill="#e8f4f8" opacity="0.5" class="shelter-wind"/>
</svg>